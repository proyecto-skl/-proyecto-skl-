<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─── SEO & Meta ──────────────────────────────────────── -->
  <title>Demon List — Geometry Dash Rankings</title>
  <meta name="description" content="The definitive community ranking of the hardest Geometry Dash Extreme Demons and Challenges." />
  <meta name="theme-color" content="#080b12" />

  <!-- Open Graph -->
  <meta property="og:title" content="Demon List" />
  <meta property="og:description" content="The hardest Geometry Dash levels, ranked." />
  <meta property="og:type" content="website" />

  <!-- ─── Favicon (inline SVG) ────────────────────────────── -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />

  <!-- ─── Stylesheet ──────────────────────────────────────── -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     APP WRAPPER — Flex container: sidebar + main-content
═══════════════════════════════════════════════════════════ -->
<div class="app-wrapper">

  <!-- ── SIDEBAR ────────────────────────────────────────────── -->
  <aside class="sidebar" role="navigation" aria-label="Site navigation">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-title">DEMON<br><span>LIST</span></div>
      <div class="logo-sub">GD Community Rankings</div>
    </div>

    <!-- Navigation links -->
    <nav class="sidebar-nav">
      <div class="nav-section-label">Rankings</div>

      <a href="#mainlist" class="nav-link" data-page="mainlist">
        <span class="nav-icon">🔥</span>
        Main List
      </a>

      <a href="#challenges" class="nav-link" data-page="challenges">
        <span class="nav-icon">⚔️</span>
        Challenges
      </a>

      <a href="#leaderboard" class="nav-link" data-page="leaderboard">
        <span class="nav-icon">🏆</span>
        Leaderboard
      </a>

      <div class="nav-section-label">Community</div>

      <a href="#news" class="nav-link" data-page="news">
        <span class="nav-icon">📰</span>
        News
      </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      Demon List © 2024<br>
      GD Community Project
    </div>
  </aside>
  <!-- END SIDEBAR -->

  <!-- ── MAIN CONTENT ───────────────────────────────────────── -->
  <div class="main-content">

    <!-- Sticky Topbar -->
    <header class="topbar">
      <!-- Mobile hamburger toggle -->
      <button class="menu-toggle" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Current page title (updated by router) -->
      <span class="topbar-title" id="topbar-title">Main List</span>

      <!-- Search bar -->
      <div class="topbar-actions">
        <div class="topbar-search">
          <span>🔍</span>
          <input
            type="text"
            id="global-search"
            placeholder="Search levels..."
            aria-label="Search"
          />
        </div>
      </div>
    </header>

    <!-- ── PAGE OUTLET ────────────────────────────────────────
         This div is replaced by the router on every navigation.
         Each page module renders its content here.
    ──────────────────────────────────────────────────────── -->
    <main class="page-content" id="page-outlet">
      <!-- Content injected by JS router -->
      <div class="state-message">
        <div class="spinner"></div>
      </div>
    </main>

  </div>
  <!-- END MAIN CONTENT -->

</div>
<!-- END APP WRAPPER -->

<!-- ─── JavaScript ───────────────────────────────────────────
     type="module" enables ES module imports (import/export).
     Required for the page module system to work.
     GitHub Pages serves static files — this works out of the box.
─────────────────────────────────────────────────────────── -->
<script type="module" src="js/app.js"></script>

</body>
</html>
