<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Demon List — Geometry Dash Rankings</title>
  <meta name="description" content="The definitive community ranking of the hardest Geometry Dash Extreme Demons and Challenges." />
  <meta name="theme-color" content="#080b12" />

  <meta property="og:title" content="Demon List" />
  <meta property="og:description" content="The hardest Geometry Dash levels, ranked." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />

  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    
    <div class="sidebar-brand" style="padding: 20px 15px; display: flex; align-items: center; justify-content: center;">
      <img src="assets/logo_titulo.png" alt="Demon List Logo" style="max-width: 100%; max-height: 40px; object-fit: contain; display: block; margin: 0 auto;">
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="#" class="nav-link active" data-page="mainlist">
            <span class="nav-icon">🏆</span>
            <span class="nav-label">Main List</span>
          </a>
        </li>
        <li>
          <a href="#challenges" class="nav-link" data-page="challenges">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Challenges</span>
          </a>
        </li>
        <li>
          <a href="#leaderboard" class="nav-link" data-page="leaderboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Leaderboard</span>
          </a>
        </li>

        <li class="nav-separator"></li>

        <li>
          <a href="#news" class="nav-link" data-page="news">
            <span class="nav-icon">📰</span>
            <span class="nav-label">News</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <p>v1.0.0 — Stable</p>
    </div>
  </aside>

  <div class="main-content">

    <header class="topbar">
      <button class="menu-toggle" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <span class="topbar-title" id="topbar-title">Main List</span>

      <div class="topbar-actions">
        <div class="topbar-search">
          <span>🔍</span>
          <input
            type="text"
            id="global-search"
            placeholder="Search levels..."
            aria-label="Search"
          />
        </div>
      </div>
    </header>

    <main class="page-content" id="page-outlet">
      <div class="state-message">
        <div class="spinner"></div>
      </div>
    </main>

  </div>
  </div>
<script type="module" src="js/app.js"></script>

</body>
</html>
